<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray icon</title>
<style>
  @font-face { font-family: 'Outfit'; src: url('assets/fonts/Outfit.woff2') format('woff2'); font-weight: 200 700; }
  html, body { margin: 0; width: 32px; height: 32px; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="32" height="32"></canvas>
<script>
  // Renders the tray icon: a ring that empties as the work interval runs out, minutes left in the middle.
  const c = document.getElementById('c'), g = c.getContext('2d');
  const ACCENT = '#f0b58f';
  function draw(d) {
    g.clearRect(0, 0, 32, 32);
    const cx = 16, cy = 16, r = 14, w = 3;
    g.lineWidth = w; g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,0.28)';
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
    if (d.fraction > 0) {
      g.strokeStyle = ACCENT;
      g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, d.fraction)); g.stroke();
    }
    if (d.text) {
      g.fillStyle = d.phase === 'warning' ? ACCENT : '#ffffff';
      g.font = `700 ${d.text.length > 2 ? 14 : 17}px Outfit, 'Segoe UI', sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(d.text, cx, cy + 1);
    } else if (d.phase === 'break') {
      g.fillStyle = ACCENT;
      g.beginPath(); g.arc(cx, cy, 5, 0, Math.PI * 2); g.fill();
    }
  }
  document.fonts.ready.then(() => window.stan.ready());
  window.stan.onState((d) => draw(d));
</script>
</body>
</html>
